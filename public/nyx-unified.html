  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e's surfaces carry real saturation —\n// not near-black/near-white neutrals with a lone accent dot. Lightness gaps keep contrast high.\nconst THEME_DEFS = [\n  { name: 'Crimson', mode: 'dark', hue: 350 }, { name: 'Amber', mode: 'dark', hue: 35 },\n  { name: 'Gold', mode: 'dark', hue: 50 }, { name: 'Lime', mode: 'dark', hue: 95 },\n  { name: 'Emerald', mode: 'dark', hue: 150 }, { name: 'Teal', mode: 'dark', hue: 175 },\n  { name: 'Cyan', mode: 'dark', hue: 190 }, { name: 'Azure', mode: 'dark', hue: 210 },\n  { name: 'Indigo', mode: 'dark', hue: 245 }, { name: 'Violet', mode: 'light', hue: 265 },\n  { name: 'Magenta', mode: 'light', hue: 310 }, { name: 'Rose', mode: 'light', hue: 340 },\n  { name: 'Orange', mode: 'light', hue: 20 }, { name: 'Sage', mode: 'light', hue: 120 },\n  { name: 'Slate Blue', mode: 'light', hue: 220 }\n];\n// macOS Light — matches the NoteCortex reference screenshot: pure white surfaces, hairline grey\n// borders, near-black text, system blue links/accents. Kept as its own literal (not hue-generated)\n// so it stays pixel-true to the reference rather than drifting with the HSL formula.\nconst MACOS_LIGHT = {\n  name: 'macOS Light', mode: 'light',\n  ink0: '#E8E8ED', ink1: '#FFFFFF', ink2: '#F6F6F7', ink3: '#EDEDEF', ink4: '#DBDBDF',\n  bone0: '#1D1D1F', bone1: '#4A4A4E', bone2: '#8A8A8E', bone3: '#C2C2C6',\n  accent: '#0A5FFF'\n};\nconst THEMES = [MACOS_LIGHT, ...THEME_DEFS.map(t => t.mode === 'dark' ? {\n  name: t.name, mode: t.mode,\n  ink0: `hsl(${t.hue} 40% 5%)`, ink1: `hsl(${t.hue} 35% 9%)`, ink2: `hsl(${t.hue} 32% 12%)`,\n  ink3: `hsl(${t.hue} 30% 17%)`, ink4: `hsl(${t.hue} 26% 24%)`,\n  bone0: `hsl(${t.hue} 15% 96%)`, bone1: `hsl(${t.hue} 12% 80%)`, bone2: `hsl(${t.hue} 10% 60%)`, bone3: `hsl(${t.hue} 10% 38%)`,\n  accent: `hsl(${t.hue} 85% 62%)`\n} : {\n  name: t.name, mode: t.mode,\n  ink0: `hsl(${t.hue} 50% 100%)`, ink1: `hsl(${t.hue} 45% 97%)`, ink2: `hsl(${t.hue} 40% 93%)`,\n  ink3: `hsl(${t.hue} 38% 88%)`, ink4: `hsl(${t.hue} 35% 76%)`,\n  bone0: `hsl(${t.hue} 45% 11%)`, bone1: `hsl(${t.hue} 30% 26%)`, bone2: `hsl(${t.hue} 22% 43%)`, bone3: `hsl(${t.hue} 15% 62%)`,\n  accent: `hsl(${t.hue} 75% 40%)`\n})];\n\nclass Component extends DCLogic {\n  containerRef = React.createRef();\n\n  state = {\n    themeIndex: 0, // 0 = macOS Light default\n    activeTab: 1,\n    sidebarCollapsed: window.innerWidth < 700,\n    sectionsOpen: { cockpit: true, blades: true, notes: true, tags: true },\n    notesFolders: [\n      { name: \"01-projets\", expanded: false, files: [] },\n      { name: \"_KM\", expanded: true, files: [\"Base Lien.md\", \"Raindrop Full Ingest.md\"] },\n      { name: \"_Dash\", expanded: false, files: [] },\n      { name: \"02-apps\", expanded: false, files: [] },\n      { name: \"_Tools\", expanded: false, files: [] }\n    ],\n    bladeItems: [{icon:\"library\",label:\"Bibliothèque\",color:\"var(--ic-blue)\",installed:true},{ icon: \"files\", label: \"Documents\", color: \"var(--ic-blue)\", count: null, installed: true }, { icon: \"sliders-horizontal\", label: \"Registry\", color: \"var(--ic-green)\", count: null, installed: true }],\n    tabs: [{label:'Bibliothèque',kind:'ux',focusedPane:'ux-root',zoomedPane:null,columns:[]},\n      { label: 'Dashboard', focusedPane: 'dNOW', zoomedPane: null, columns: [\n          { id: 'dc1', width: 20, panes: [{ id: 'dNOW', title: 'NOW', source: '', height: 100, collapsed: false, editable: false,\n              items: [\n                { dot: 'var(--ic-red)', text: 'Sync KM Raindrop cassé depuis migration', meta: '2h', color: 'var(--bone-0)' },\n                { dot: 'var(--ic-red)', text: 'Rail gauche pliable/dépliable — implémentation', meta: '40m', color: 'var(--bone-0)' }\n              ] }] },\n          { id: 'dc2', width: 20, panes: [{ id: 'dNEXT', title: 'NEXT', source: '', height: 100, collapsed: false, editable: false,\n              items: [\n                { dot: 'var(--ic-orange)', text: 'Auditer icônes Smart Sorter', meta: '—', color:          { dot: 'var(--bone-3)', text: 'Auditer icônes Smart Sorter', meta: '1j', color: 'var(--bone-1)' }\n              ] }] },\n          { id: 'c2', width: 33.33, panes: [{ id: 'p2', title: 'Journal — unification', source: 'NotePlan', height: 100, collapsed: false, editable: true,\n              items: [\n                { dot: null, text: 'Rail gauche pliable/dépliable. Panes déplaçables par drag du header.', color: 'var(--bone-1)' },\n                { dot: null, text: 'Chaque pane se replie en un bandeau via le chevron.', color: 'var(--bone-1)' },\n                { dot: null, text: 'Onglets et modules réordonnables par glisser-déposer.', color: 'var(--bone-1)' }\n              ] }] },\n          { id: 'c3', width: 33.33, panes: [{ id: 'p3', title: 'Captures', source: 'Raindrop', height: 100, collapsed: false, editable: false,\n              items: [\n                { dot: 'var(--ic-blue)', text: 'devonthink.com/inbox-triage', meta: '08:41', color: 'var(--bone-1)' },\n                { dot: 'var(--ic-purple)', text: 'note — règles de tags Nyx v0', meta: '08:12', color: 'var(--bone-1)' },\n                { dot: 'var(--ic-blue)', text: 'capture — sidebar NotePlan', meta: '07:58', color: 'var(--bone-1)' }\n              ] }] }\n        ] },\n      { label: 'Queue', focusedPane: 'q1', zoomedPane: null, columns: [\n          { id: 'qc1', width: 100, panes: [{ id: 'q1', title: 'Queue — toutes urgences', source: 'Queue', height: 100, collapsed: false, editable: false, kind: 'queue',\n              items: [\n                { dot: 'var(--ic-red)', text: 'Sync KM Raindrop cassé depuis migration', source: 'KM Raindrop', meta: '2h', color: 'var(--bone-0)' },\n                { dot: 'var(--ic-orange)', text: 'Doublon dashboard / blade Agenda', source: 'Dashboard', meta: '6h', color: 'var(--bone-0)' },\n                { dot: 'var(--ic-red)', text: 'App Inventory affiche un module fantôme', source: 'Inventory', meta: '9h', color: 'var(--bone-0)' },\n                { dot: 'var(--bone-3)', text: 'Auditer icônes Smart Sorter', source: 'Sorter', meta: '1j', color: 'var(--bone-1)' }\n              ] }] }\n        ] },\n      { label: 'Agenda', focusedPane: 'a1', zoomedPane: null, columns: [\n          { id: 'ac1', width: 100, panes: [{ id: 'a1', title: 'Agenda du jour', source: 'Smart Sorter', height: 100, collapsed: false, editable: true,\n              items: [\n                { dot: null, text: '09:00 — Point équipe', color: 'var(--bone-1)', meta: '30m' },\n                { dot: null, text: '11:00 — Revue des blades Nyx', color: 'var(--bone-1)', meta: '1h' },\n                { dot: null, text: '14:00 — Bloc deep work KM Raindrop', color: 'var(--bone-1)', meta: '2h' }\n              ] }] }\n        ] },\n      { label: 'note-4', focusedPane: 'n1', zoomedPane: null, columns: [\n          { id: 'nc1', width: 100, panes: [{ id: 'n1', title: 'note-4', source: 'NotePlan', height: 100, collapsed: false, editable: true,\n              items: [{ dot: null, text: 'Pane vide — ouvre une note pour la lier ici.', color: 'var(--bone-2)' }] }] }\n        ] },\n      { label: 'Graph', focusedPane: 'g1', zoomedPane: null, columns: [\n          { id: 'gc1', width: 100, panes: [{ id: 'g1', title: 'Knowledge Graph', source: 'Search', height: 100, collapsed: false, editable: false,\n              items: [{ dot: null, text: 'Graphe désactivé par défaut — active-le depuis la barre d’outils.', color: 'var(--bone-2)' }] }] }\n        ] },\n      { label: 'INDEX_GLOBAL', focusedPane: 'i1', zoomedPane: null, columns: [\n          { id: 'ic1', width: 100, panes: [{ id: 'i1', title: 'Index global', source: 'Nyx', height: 100, collapsed: false, editable: false,\n              items: [{ dot: null, text: 'Vue agrégée de tous les blades — lecture seule.', color: 'var(--bone-1)' }] }] }\n        ] },\n      { label: 'NoteCortex', focusedPane: 'nc1', zoomedPane: null, columns: [\n          { id: 'ncc1', width: 100, panes: [{ id: 'nc1', title: 'Cartouche — Actions esearch]\\\\n    layout: terminal_primary_docs_side\\\\n  km:\\\\n    blades: [documents, web_research]\\\\n    layout: sources_notes_graph_ready\\\\n\\\", \\\"skins.yml\\\": \\\"version: 0\\\\nskin_contract:\\\\n  required:\\\\n    - id\\\\n    - product_name\\\\n    - logo\\\\n    - palette\\\\n    - typography\\\\n    - icons\\\\n    - wording\\\\n    - density\\\\nskins:\\\\n  notecortex_light:\\\\n    status: prototype_reference\\\\n    palette: light_clean\\\\n  iterm_dark:\\\\n    status: planned\\\\n    palette: dark_terminal\\\\n  nyx_glass:\\\\n    status: planned\\\\n    palette: glass_dashboard\\\\n  client_white_label:\\\\n    status: manifest_driven\\\\n    palette: client_defined\\\\nrules:\\\\n  skin_does_not_modify_business_code: true\\\\n\\\", \\\"vocabulary.yml\\\": \\\"version: 0\\\\nterms:\\\\n  Mistress:\\\\n    role: source_privee_rd\\\\n    public: false\\\\n  NeuroForge:\\\\n    role: intelligence_creation_rollout\\\\n    public: partial\\\\n  Metis:\\\\n    role: renseignement_transversal_arbitrage\\\\n    public: partial\\\\n  Nyx:\\\\n    role: framework_complet\\\\n    public: partial\\\\n  Module:\\\\n    role: expertise_metier_ou_transversale\\\\n    public: selective\\\\n  Blade:\\\\n    role: fonction_experte\\\\n    public: selective\\\\n  Rack:\\\\n    role: groupe_blades_equipe\\\\n    public: selective\\\\n  Combo:\\\\n    role: combinaison_resultat\\\\n    public: selective\\\\n  Skin:\\\\n    role: identite_graphique_branding\\\\n    public: true\\\\n  Export:\\\\n    role: version_epuree_publique_client_premium_internal\\\\n    public: true\\\\nrules:\\\\n  preserve_user_terms: true\\\\n  do_not_rename_without_explicit_request: true\\\\n  do_not_publish_private_source: true\\\\n\\\"};\\nconst LS='nyx-registry-console-v0';\\nconst state=JSON.parse(window.NyxStore.getItem(LS)||'null')||{files:initial,product:{name:'Nyx Studio',visibility:'public',skin:'notecortex_light',rack:'writing'},enabled:{modules:['documents','web','communication'],blades:['documents','web_research','neuroforge_comms'],racks:['writing'],combos:['public_repo_launch']}};\\nconst sections=[['product','Produit'],['modules','Modules'],['blades','Blades'],['racks','Racks'],['combos','Combos'],['skins','Skins'],['exports','Exports'],['raw','YAML brut']];let active='product';\\nfunction save(){window.NyxStore.setItem(LS,JSON.stringify(state));document.getElementById('saveState').textContent='autosave '+new Date().toLocaleTimeString('fr-FR')}\\nfunction btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}\\nfunction field(label,key,options){const l=document.createElement('label');l.textContent=label;let el=options?document.createElement('select'):document.createElement('input');el.id='product-'+key;if(options)options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;el.append(op)});el.value=state.product[key]||'';el.oninput=()=>{state.product[key]=el.value;save();renderSide()};l.append(el);return l}\\nfunction parseIds(file){return (state.files[file]||'').split('\\\\n').map(line=>{const m=line.match(/^  ([a-zA-Z0-9_-]+):$/);return m?m[1]:null}).filter(Boolean)}\\nfunction toggle(kind,id){const arr=state.enabled[kind];const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);save();render()}\\nfunction renderNav(){const n=document.getElementById('nav');n.replaceChildren(...sections.map(([id,label])=>btn(label,()=>{active=id;render()},id===active?'active':'')))}\\nfunction cards(kind,file,title){const ids=parseIds(file);const d=document.createElement('div');d.className='card';d.innerHTML='<h2>'+title+'<\\/h2><p class=\\\"muted\\\">Activer uniquement ce qui doit sortir dans le produit.<\\/p>';const list=document.createElement('div');list.className='list';ids.forEach(id=>{const on=state.enabled[kind].includes(id);const item=document.createElement('div');item.className='item';item.innerHTML='<b>'+id+'<\\/b><span class=\\\"muted\\\">'+(on?'inclus':'exclu')+'<\\/span>';item.append(btn(on?'Retirer':'Inclure',()=>toggle(kind,id)));list.append(item)});d.append(list);return d}\\nfunction rawEditor(){const box=document.createElement('div');box.className='grid';Object.keys(state.files).sort().forEach(name=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+name+'<\\/h3>';const ta=document.createElement('textarea');ta.className='raw-editor';ta.value=state.files[name];ta.oninput=()=>{state.files[name]=ta.value;save();renderSide()};c.append(ta);box.append(c)});return box}\\nfunction productView(){const d=document.createElement('div');d.className='grid';const c=document.createElement('div');c.className='card';c.innerHTML='<h2>Générateur marque blanche<\\/h2>';c.append(field('Nom produit','name'),field('Visibilité','visibility',['public','private_client','premium','internal']),field('Skin','skin',parseIds('skins.yml')),field('Rack de départ','rack',parseIds('racks.yml')));const c2=document.createElement('div');c2.className='card';c2.innerHTML='<h2>Sortie automatique<\\/h2><p>Le manifest choisit quoi inclure, quoi exclure, quel skin appliquer et quelle communication générer.<\\/p>';c2.append(btn('Préparer export',()=>{active='exports';render()}),btn('Préparer communication',()=>{state.enabled.modules.push('communication');state.enabled.modules=[...new Set(state.enabled.modules)];save();renderSide()}));d.append(c,c2);return d}\\nfunction render(){renderNav();const v=document.getElementById('view');const current=sections.find(([id])=>id===active);document.getElementById('mainTitle').textContent=current?current[1]:'Produit';v.replaceChildren();if(active==='product')v.append(productView());if(active==='modules')v.append(cards('modules','modules.yml','Modules'));if(active==='blades')v.append(cards('blades','blades.yml','Blades expertes'));if(active==='racks')v.append(cards('racks','racks.yml','Racks'));if(active==='combos')v.append(cards('combos','combos.yml','Combos'));if(active==='skins')v.append(cards('skins','skins.yml','Skins'));if(active==='exports')v.append(cards('combos','exports.yml','Exports'));if(active==='raw')v.append(rawEditor());renderSide()}\\nfunction renderSide(){document.getElementById('steps').innerHTML=['Lire Mistress source','NeuroForge inventorie','Mètis arbitre public/privé','Nyx compose rack + blades','Sanitize export','Build package','Générer README/pages/badges/posts','Review humaine','Publish'].map(x=>'<li>'+x+'<\\/li>').join('');const plan={product:state.product,include:state.enabled,exclude:['private_prompts','secrets','local_paths','client_data','premium_logic_non_autorisee'],checks:['registry présent','sauvegarde locale','manifest export','review avant publication']};document.getElementById('plan-json').textContent=JSON.stringify(plan,null,2);const checks=document.getElementById('checks');checks.replaceChildren();[['Modules',state.enabled.modules.length],['Blades',state.enabled.blades.length],['Racks',state.enabled.racks.length],['Combos',state.enabled.combos.length]].forEach(([k,v])=>{const div=document.createElement('div');div.className='item';div.innerHTML='<b>'+k+'<\\/b><span class=\\\"'+(v?'ok':'warn')+'\\\">'+v+' sélectionné(s)<\\/span>';checks.append(div)})}\\ndocument.getElementById('exportJson').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nyx-registry-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};\\ndocument.getElementById('copyPrompt').onclick=async()=>{const prompt='Utilise ce registry pour préparer un export propre. Produit: '+state.product.name+'; modules: '+state.enabled.modules.join(', ')+'; blades: '+state.enabled.blades.join(', ')+'. Génère seulement des brouillons et demande validation avant publication.';await navigator.clipboard.writeText(prompt);document.getElementById('saveState').textContent='prompt copié'};\\nwindow.applyNyxProject=(project,skins)=>{state.product.name=project.project.name;state.product.skin=project.theme.name;render();const n=document.getElementById('product-name');if(n){n.readOnly=true;n.title='Identité partagée avec le projet';}const s=document.getElementById('product-skin');if(s){s.replaceChildren(...skins.map(item=>{const o=document.createElement('option');o.value=item.name;o.textContent=item.name;return o;}));s.value=project.theme.name;s.oninput=()=>parent.NyxSelectThemeName(s.value);}save();};\\nrender();\\n<\\/script>\\n<\\/body>\\n<\\/html>\";\nlet registryFrame=null;function mountRegistry(){\n  const slot=document.getElementById('nyx-registry-slot');\n  if(!slot){const existing=registryFrame;if(existing){existing.hidden=true;if(existing.parentNode!==document.body)document.body.append(existing);}return;}\n  let frame=registryFrame;\n  if(!frame){\n    frame=document.createElement('iframe');registryFrame=frame;\n    frame.dataset.nyxRegistry='true';\n    frame.title='Nyx Registry Console';\n    frame.style.cssText='border:0;width:100%;height:100%;display:block;background:#f6f3ee';\n    frame.srcdoc=registrySrcDoc.replace(\"<head>\",\"<head><script>window.NyxStore=parent.NyxStore;<\\/script>\");\n    slot.replaceChildren(frame);\n  }\n  frame.hidden=false;if(frame.parentNode!==slot)slot.append(frame);\n}\nconst obs=new MutationObserver(mountRegistry);\nobs.observe(document.body,{childList:true,subtree:true});\nmountRegistry();\n})();\n<\/script>\n<\/body><\/html>"</script>
